    <script>
      (function () {
        var ORIGIN = "https://www.cloudstrail.com";
        var path = (window.location.pathname || "/").replace(/\/{2,}/g, "/");
        if (path.length > 1) path = path.replace(/\/+$/, "");
        var aliasMap = {
          "/home": "/",
          "/about-us": "/about",
          "/courses": "/programs",
          "/blogs": "/blog",
          "/privacy-policy": "/privacy",
          "/terms-condition": "/terms",
          "/terms-conditions": "/terms",
          "/terms-and-conditions": "/terms",
          "/terms-of-service": "/terms",
          "/refund-policy": "/refund",
        };
        if (/^\/blogs\/[^/]+$/i.test(path)) {
          path = "/blog/" + (path.split("/")[2] || "");
        } else if (/^\/courses\/[^/]+$/i.test(path)) {
          path = "/course/" + (path.split("/")[2] || "");
        } else if (aliasMap[path]) {
          path = aliasMap[path];
        }
        var canonical = ORIGIN + path;
        var canonicalTag = document.head.querySelector('link[rel="canonical"]');
        if (canonicalTag) canonicalTag.setAttribute("href", canonical);
        var ogUrl = document.head.querySelector('meta[property="og:url"]');
        if (ogUrl) ogUrl.setAttribute("content", canonical);
      })();
    </script>
